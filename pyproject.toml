[project]
name = "forktex"
version = "0.8.1"
description = "Agentic software-delivery CLI + builtin knowledge base for any software project — chat, ground, recycle, deploy."
authors = [
    {name = "FORKTEX",email = "info@forktex.com"}
]
readme = "README.md"
# Dual-licensed: AGPL-3.0-or-later for OSS use; a proprietary commercial
# license is also available (see LICENSE + NOTICE; info@forktex.com).
license = "AGPL-3.0-or-later"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.14,<4.0"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Distributed Computing",
    "Topic :: System :: Systems Administration",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "forktex-intelligence (>=1.5.0,<2.0.0)",
    "forktex-cloud (>=2.1.0,<3.0.0)",
    "forktex-network (>=0.2.3,<0.3.0)",
    "pydantic (>=2.11.10,<3.0.0)",
    "httpx (>=0.27.0,<1.0.0)",
    "aiofiles (>=24.1.0,<25.0.0)",
    "anyio (>=4.11.0,<5.0.0)",
    "httpx-sse (>=0.4.0,<1.0.0)",
    "pyyaml>=6.0",
    "cryptography (>=46.0.6,<47.0.0)",
    "asyncclick (>=8.3.0.4,<9.0.0.0)",
    "rich (>=14.1.0,<15.0.0)",
    "prompt_toolkit (>=3.0,<4.0)",
    "playwright (>=1.40.0,<2.0.0)",
    "jinja2 (>=3.1.0,<4.0.0)",
    "forktex-core[fractal] (>=2.4.0,<3.0.0)",
]

[project.optional-dependencies]
web = ["fastapi>=0.115.0", "uvicorn[standard]>=0.30.0"]
# MCP is an adapter on the knowledge API, not core. One extra: fastapi-mcp
# mounts MCP-over-HTTP on the FastAPI app AND pulls the `mcp` protocol lib
# transitively (so the stdio `forktex knowledge mcp` entry works too).
mcp = ["fastapi-mcp>=0.3.0,<1.0.0", "fastapi>=0.115.0", "uvicorn[standard]>=0.30.0"]

[project.scripts]
forktex = "forktex.agent.cli:main"

[project.urls]
"Homepage" = "https://forktex.com"
"Repository" = "https://github.com/forktex/forktex-python"
"Bug Tracker" = "https://github.com/forktex/forktex-python/issues"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.0.3,<10.0.0)",
    "pytest-asyncio (>=1.2.0,<2.0.0)",
    "ruff (>=0.8.0)",
    "respx (>=0.21.0)",
    "pyright (>=1.1.350)",
    "pip-audit (>=2.7.0)",
    "pygments (>=2.20.0)",
    "build (>=1.2.0,<2.0.0)",
    "twine (>=5.0.0,<7.0.0)",
]

[tool.ruff]
# Pin the formatter/linter target to py313. ruff's py314 handling has a bug
# where it strips the required parentheses from a multi-exception
# `except (A, B):` clause (turning it into the Python-2 `except A, B:` —
# invalid in any Python 3). requires-python is still >=3.14; this only fixes
# how ruff formats, and py313 output is identical except for that bug.
target-version = "py313"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
