[project]
name = "forktex"
version = "1.0.0"
description = "The shared Python substrate for ForkTex services — logging, errors, types, and one facade per piece of infrastructure."
authors = [
    {name = "FORKTEX",email = "info@forktex.com"}
]
readme = "README.md"
license = "AGPL-3.0-or-later OR LicenseRef-ForkTex-Commercial"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.14,<4.0"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.14",
    "Topic :: Database",
    "Topic :: Software Development",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Logging",
    "Typing :: Typed",
]
dependencies = [
    "sqlalchemy[asyncio]>=2.1.6",
    "asyncpg>=0.32",
    "redis[hiredis]>=8.1",
    "pydantic>=2.14",
    "fastapi>=0.162",
    "aioboto3>=15.5",
]

[project.urls]
"Homepage" = "https://forktex.com"
"Repository" = "https://github.com/forktex/forktex-py"
"Documentation" = "https://github.com/forktex/forktex-py/tree/master/docs"
"Changelog" = "https://github.com/forktex/forktex-py/blob/master/CHANGELOG.md"
"Bug Tracker" = "https://github.com/forktex/forktex-py/issues"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [{ include = "forktex", from = "src" }]
include = [{ path = "src/forktex/py.typed", format = ["sdist", "wheel"] }]
exclude = ["backlog/**"]

[dependency-groups]
dev = [
    "pytest>=9.2",
    "pytest-asyncio>=1.4",
    "pytest-cov>=7.1",
    "ruff>=0.17.3",
    "pyright>=1.1.414",
    "pip-audit>=2.10.1",
    "build>=1.6.1",
    "twine>=7.0",
    "testcontainers>=4.15",
    "testcontainers[redis]>=4.15",
    "httpx>=0.28.1",
    "httpx2>=2.16",
]

[tool.ruff]
target-version = "py314"
line-length = 120
exclude = ["backlog"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "ANN"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E1", "E2", "E5", "I", "UP", "B", "BLE", "N", "SIM", "RUF", "ANN"]

[tool.pyright]
include = ["src"]
exclude = ["backlog", "**/__pycache__"]
pythonVersion = "3.14"
typeCheckingMode = "basic"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
norecursedirs = ["backlog", ".venv", "dist", "build"]
log_cli = false
log_level = "WARNING"
markers = [
    "perf: opt-in performance/limits tests; excluded from `make test` and `make ci`",
]
addopts = "-m 'not perf'"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::pytest.PytestUnraisableExceptionWarning",
]
